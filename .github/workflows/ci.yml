name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build single-file index.html
        if: hashFiles('build.mjs') != '' && hashFiles('src/html/body.html') != ''
        run: node build.mjs

      - name: Run test suite
        if: hashFiles('test.mjs') != ''
        run: node test.mjs
